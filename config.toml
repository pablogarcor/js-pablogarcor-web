baseURL = 'https://www.pablogarcor.com/'
title = 'Pablo García Ortega'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

# No tag or category pages: there are no templates for them, and Hugo would
# list them in the sitemap anyway. Tags are still shown as text on each post.
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.en]
    contentDir = 'content/en'
    locale = 'en-US'
    label = 'English'
    weight = 1

  [languages.es]
    contentDir = 'content/es'
    locale = 'es-ES'
    label = 'Español'
    weight = 2

[permalinks]
  blog = "/:slug/"

# Structured data and link previews (layouts/_partials/head.html,
# share-image.html and structured-data.html).
[params.author]
  # The Person declared on the CV (pablogarciaortega.com). Using the same @id
  # lets search engines attribute the posts to that person.
  id = 'https://pablogarciaortega.com/#person'
  name = 'Pablo García Ortega'
  url = 'https://pablogarciaortega.com/'

[params.shareImage]
  # Default image for link previews (home, blog archive and posts without
  # images). Generated once, 1200 x 630 JPG; its text is name, job title and
  # domain, so the alt text is the same in both languages.
  path = 'images/share.jpg'
  width = 1200
  height = 630
  alt = 'Pablo García Ortega · Software Engineer · pablogarcor.com'

# Profiles linked from the footer with rel="me" (layouts/_partials/contact.html),
# the same ones the CV links to.
[[params.profiles]]
  name = 'X'
  url = 'https://x.com/pablogarcor'
[[params.profiles]]
  name = 'GitHub'
  url = 'https://github.com/pablogarcor'
[[params.profiles]]
  name = 'GitLab'
  url = 'https://gitlab.com/pablogarcor'
[[params.profiles]]
  name = 'LinkedIn'
  url = 'https://www.linkedin.com/in/garciaortegapablo/'
