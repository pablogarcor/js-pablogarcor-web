baseURL = 'https://www.pablogarcor.com/'
title = 'pablogarcor Site'
defaultContentLanguage = 'en'
defaultContentLanguageInSubdir = false

# No tag or category pages: there are no templates for them, and Hugo would
# list them in the sitemap anyway. Tags are still shown as text on each post.
disableKinds = ['taxonomy', 'term']

[languages]
  [languages.en]
    contentDir = 'content/en'
    locale = 'en-US'
    label = 'English'
    weight = 1

  [languages.es]
    contentDir = 'content/es'
    locale = 'es-ES'
    label = 'Español'
    weight = 2

[permalinks]
  blog = "/:slug/"
