{{ $aboutURL := printf "%s#about" ("/" | relLangURL) }}
<div

        class="email__container"
>
    <div style="display: flex;">
        <div
                style="
                    display: flex;
                    flex-direction: column;
                    width: fit-content;
                "
        >
            <div
                    class="email__link"
            >
                <a
                        onmouseenter="changeColor('red','name')"
                        onmouseleave="changeColor('inherit','name')"
                        href="{{ $aboutURL }}"

                        style="
                    margin-block-start: 1em;
                    margin-block-end: 1em;
                    "
                >
                    {{ i18n "contact_me" }}
                </a>
            </div>
            <div
                    style="
                        border-top: 1px solid;
                        border-left: 1px solid;
                        border-right: 1px solid;
                        height: 1em;
                    "></div>
            <div
                    style="
                        line-height: 1.15;
                        font-size: 3em;
                        width: fit-content;
                    "
            >
                <span
                        style="color: inherit"
                        class="email__title name email"
                >
                    pablo
                </span>
            </div>
        </div>
        <div
                style="
                    display: flex;
                    flex-direction: column;
                    width: fit-content;
                "
        >
            <div
                    style="
                height: calc( 19em + 1px );
                "></div>
            <div
                    style="
                        line-height: 1.15;
                        font-size: 3em;
                        width: fit-content;
                    "
            >
                <span
                        style="color: inherit"
                        class="email__title profiles email"
                >
                    @
                </span>
                <div
                        style="
                            border-bottom: 1px solid;
                            border-left: 1px solid;
                            height: 0.33333em;
                        "></div>
            </div>
        </div>
        <div
                style="
                    display: flex;
                    flex-direction: column;
                    width: fit-content;
                "
        >
            <div
                    class="email__link"
            >
                <a
                        onmouseenter="changeColor('darkgreen','web')"
                        onmouseleave="changeColor('inherit','web')"
                        href="{{ "/" | relURL }}"
                        style="
                    margin-block-start: 1em;
                    margin-block-end: 1em;
                    "
                >
                    Web
                </a>
            </div>
            <div
                    style="
                        border-top: 1px solid;
                        border-left: 1px solid;
                        border-right: 1px solid;
                        height: 1em;
                    "></div>
            <div
                    style="
                        display: flex;
                        width: fit-content;
                    "
            >
                <div
                        style="
                            line-height: 1.15;
                            font-size: 3em;
                            width: fit-content;
                        "
                >
                    <span
                            style="color: inherit"
                            class="email__title profiles web email"
                    >
                        pablogarcor
                    </span>
                    <div
                            style="
                                border-bottom: 1px solid;
                                border-right: 1px solid;
                                height: 0.33333em;
                            "></div>
                    <div
                            class="email__link email__link-profiles"
                    >
                        <button
                                type="button"
                                class="email__profiles-toggle"
                                aria-expanded="false"
                                aria-controls="email-profiles-menu"
                                onmouseenter="changeColor('var(--page-link-color)','profiles')"
                                onmouseleave="changeColor('inherit','profiles')"
                        >
                            {{ i18n "social_profiles" }}
                        </button>
                        <div class="email__profiles-anchor">
                            <ul class="email__profiles-menu" id="email-profiles-menu" hidden>
                                {{ range site.Params.profiles }}
                                <li><a href="{{ .url }}" target="_blank" rel="me noreferrer">{{ .name }}</a></li>
                                {{ end }}
                            </ul>
                        </div>
                    </div>
                </div>
                <div
                        style="
                            line-height: 1.15;
                            font-size: 3em;
                            width: fit-content;
                        "
                >
                    <span
                            style="color: inherit"
                            class="email__title web email"
                    >
                        .com
                    </span>
                </div>
            </div>
        </div>
    </div>
    <div
            style="
                border-bottom: 1px solid;
                border-left: 1px solid;
                border-right: 1px solid;
                height: 1em;
            "></div>
    <div
            class="email__link"
    >
        <a
                onmouseenter="changeColor('orange','email')"
                onmouseleave="changeColor('inherit','email')"
                href="mailto:pablo@pablogarcor.com"
                style="
            margin-block-start: 1em;
            margin-block-end: 1em;
            "
        >
            Email
        </a>
    </div>
</div>
<script>
    (() => {
        const toggle = document.querySelector(".email__profiles-toggle")
        const menu = document.getElementById("email-profiles-menu")
        if (!toggle || !menu) return
        const setOpen = open => {
            toggle.setAttribute("aria-expanded", String(open))
            menu.hidden = !open
        }
        toggle.addEventListener("click", () => setOpen(menu.hidden))
        document.addEventListener("click", e => {
            if (!menu.hidden && !toggle.contains(e.target) && !menu.contains(e.target)) setOpen(false)
        })
        document.addEventListener("keydown", e => {
            if (e.key === "Escape" && !menu.hidden) { setOpen(false); toggle.focus() }
        })
    })()
    const changeColor = (color, className) => {
        const els = document.getElementsByClassName(className)
        for (const element of els) {
            element.style.color = color
        }
    }
</script>
